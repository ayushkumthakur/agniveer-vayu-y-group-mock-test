<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agniveer Vayu Y Group Mock Test</title><style>body{font-family:Arial;margin:0;background:#eef3f8;color:#162033}header{background:#102a43;color:#fff;padding:18px;display:flex;justify-content:space-between}.timer{background:#fff;color:#102a43;padding:8px 12px;border-radius:8px;font-weight:700}.wrap{max-width:1000px;margin:24px auto;padding:0 14px}.card{background:#fff;padding:22px;border-radius:14px;box-shadow:0 4px 18px #0001}.hidden{display:none}input{width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#1565c0;color:#fff}.secondary{background:#e8eef5}.danger{background:#c62828;color:#fff}.option{display:block;padding:13px;border:2px solid #dbe3ec;border-radius:10px;margin:9px 0;cursor:pointer}.selected{border-color:#1565c0;background:#e3f2fd}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.p{padding:8px;border:0;border-radius:6px}.ans{background:#b7dfc0}.rev{background:#ffe08a}.cur{outline:2px solid #1565c0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;background:#f4f6f8;padding:12px;border-radius:10px}.stat b{font-size:24px;display:block}@media(max-width:650px){.grid{grid-template-columns:repeat(5,1fr)}.stats{grid-template-columns:repeat(2,1fr)}header{padding:12px}.wrap{margin:12px auto}.card{padding:16px}}</style></head><body><header><b>✈️ AGNIVEER VAYU — Y GROUP</b><span id="timer" class="timer">45:00</span></header><div class="wrap"><section id="start" class="card"><h1>Agniveer Vayu Y Group Mock Test</h1><p>50 Questions • 45 Minutes • Practice Test</p><label><b>Candidate Name</b></label><input id="name" placeholder="Enter your name"><p>Correct +1 • Wrong −0.25 • Unattempted 0</p><button class="btn primary" onclick="start()">Start Test</button></section><section id="test" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><b id="counter"></b><button class="btn danger" onclick="submit()">Submit Test</button></div><hr><div id="q"></div><div style="display:flex;justify-content:space-between;gap:8px;margin-top:20px"><button class="btn secondary" onclick="prev()">Previous</button><div><button class="btn secondary" onclick="clearA()">Clear</button> <button class="btn secondary" onclick="mark()">Review</button> <button class="btn primary" onclick="next()">Next</button></div></div></div><div class="card" style="margin-top:14px"><b>Question Palette</b><div id="pal" class="grid" style="margin-top:10px"></div></div></section><section id="result" class="hidden"><div class="card"><h1>Test Submitted</h1><p id="who"></p><div class="stats"><div class="stat">Score<b id="score"></b></div><div class="stat">Correct<b id="c"></b></div><div class="stat">Wrong<b id="w"></b></div><div class="stat">Unattempted<b id="u"></b></div></div><p>Percentage: <b id="pct"></b></p><button class="btn primary" onclick="location.reload()">Retake Test</button></div><div class="card" style="margin-top:14px"><h2>Answer Review</h2><div id="review"></div></div></section></div><script>const qs=[['English','Choose the correctly spelt word.',['Accomodation','Accommodation','Acommodation','Accommadation'],'B'],['English','Select the synonym of “Rapid”.',['Slow','Weak','Fast','Late'],'C'],['English','Select the antonym of “Ancient”.',['Old','Modern','Historic','Former'],'B'],['English','Fill in the blank: He ___ to school every day.',['go','going','goes','gone'],'C'],['English','Choose the correct passive voice: “They built the bridge.”',['The bridge built them.','The bridge was built by them.','The bridge is built by them.','The bridge has built by them.'],'B'],['English','One who cannot read or write is called:',['Literate','Scholar','Illiterate','Author'],'C'],['English','“Once in a blue moon” means:',['Very often','Rarely','Immediately','Daily'],'B'],['English','Identify the noun: “Honesty is the best policy.”',['best','is','honesty','the'],'C'],['English','He is ___ honest man.',['a','an','the','no article'],'B'],['English','She is good ___ mathematics.',['in','on','at','by'],'C'],['English','He said, “I am tired.”',['He said that I am tired.','He said that he was tired.','He says he was tired.','He said that he is tired.'],'B'],['English','Plural of “criterion” is:',['criterions','criteriones','criteria','criterias'],'C'],['English','Choose the correct word formed from “beauty”.',['beautify','beautiness','beautous','beautyful'],'A'],['English','Correct sentence:',['Neither of the boys are ready.','Neither of the boys is ready.','Neither boys is ready.','Neither of boys are ready.'],'B'],['English','“Break the ice” means:',['To start a conversation','To become angry','To stop work','To break something'],'A'],['Reasoning','2, 5, 10, 17, 26, ?',['35','36','37','38'],'C'],['Reasoning','If CAT → DBU, DOG → ?',['EPH','EOG','FPH','EPG'],'A'],['Reasoning','Odd one out:',['Square','Triangle','Circle','Cube'],'D'],['Reasoning','A is brother of B. B is sister of C. A is C’s:',['Brother','Sister','Father','Uncle'],'A'],['Reasoning','AZ, BY, CX, ?',['DW','EV','DU','DX'],'A'],['Reasoning','If 5+3=40 and 6+4=60, 7+2=?',['35','42','45','49'],'B'],['Reasoning','Angle at 3:00 is:',['30°','60°','90°','120°'],'C'],['Reasoning','3, 6, 12, 24, ?',['36','42','48','54'],'C'],['Reasoning','NORTH coded OPSUI. SOUTH coded:',['TPVUI','TPVTH','TPVUI','RNTUG'],'A'],['Reasoning','5 km north then 5 km east: direction?',['North','East','North-East','South-East'],'C'],['Reasoning','Odd pair:',['2–4','3–9','4–16','5–20'],'D'],['Reasoning','All roses are flowers. Definitely true:',['All roses are red','Some roses are red','Roses are flowers','No flower is a rose'],'C'],['Reasoning','Logical order: Seed, Fruit, Plant, Flower',['1,3,4,2','1,4,3,2','3,1,4,2','2,1,3,4'],'A'],['Reasoning','Mirror image is based mainly on:',['Reflection','Rotation only','Addition','Coding'],'A'],['Reasoning','If MONDAY=123456, DAY=?',['456','345','234','156'],'A'],['Reasoning','Smallest number:',['0.7','0.07','0.17','0.7'],'B'],['Reasoning','1, 4, 9, 16, ?',['20','24','25','27'],'C'],['Reasoning','If P>Q and Q>R, then:',['R>P','P>R','P=R','Q<R'],'B'],['Reasoning','Family: father, mother, two sons, two daughters =',['5','6','7','8'],'B'],['Reasoning','B, E, H, K, ?',['L','M','N','O'],'B'],['General Awareness','Capital of India:',['Mumbai','Kolkata','New Delhi','Chennai'],'C'],['General Awareness','Indian Air Force established in:',['1932','1947','1950','1962'],'A'],['General Awareness','Father of the Indian Constitution:',['Mahatma Gandhi','B. R. Ambedkar','Jawaharlal Nehru','Sardar Patel'],'B'],['General Awareness','National animal of India:',['Lion','Elephant','Bengal Tiger','Leopard'],'C'],['General Awareness','Red Planet:',['Venus','Mars','Jupiter','Mercury'],'B'],['General Awareness','Largest ocean:',['Atlantic','Indian','Arctic','Pacific'],'D'],['General Awareness','Most abundant gas in atmosphere:',['Oxygen','Nitrogen','Carbon dioxide','Hydrogen'],'B'],['General Awareness','Currency of Japan:',['Won','Yuan','Yen','Ringgit'],'C'],['General Awareness','Indian national anthem writer:',['Rabindranath Tagore','Bankim Chandra Chattopadhyay','Sarojini Naidu','Subhas Chandra Bose'],'A'],['General Awareness','SI unit of force:',['Joule','Watt','Newton','Pascal'],'C'],['General Awareness','Longest river in India:',['Yamuna','Ganga','Narmada','Godavari'],'B'],['General Awareness','Constitution came into effect:',['15 Aug 1947','26 Nov 1949','26 Jan 1950','2 Oct 1950'],'C'],['General Awareness','Organ that pumps blood:',['Lungs','Kidney','Heart','Liver'],'C'],['General Awareness','UN headquarters:',['Geneva','Paris','London','New York'],'D'],['General Awareness','Instrument for atmospheric pressure:',['Thermometer','Barometer','Hygrometer','Ammeter'],'B']];let i=0,a=Array(50).fill(''),r=Array(50).fill(false),t=2700,int;function start(){if(!name.value.trim())return alert('Enter your name');startEl();render();int=setInterval(()=>{t--;timer.textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;if(t<=0){clearInterval(int);submit(true)}},1000)}function startEl(){startSection=document.getElementById('start');startSection.classList.add('hidden');document.getElementById('test').classList.remove('hidden')}function render(){let q=qs[i];counter.textContent=`Question ${i+1} of 50 — ${q[0]}`;document.getElementById('q').innerHTML=`<h2>${q[1]}</h2>`+q[2].map((x,j)=>`<label class="option ${a[i]===String.fromCharCode(65+j)?'selected':''}"><input type="radio" name="o" ${a[i]===String.fromCharCode(65+j)?'checked':''} onclick="a[i]=String.fromCharCode(65+j);render()"> ${String.fromCharCode(65+j)}) ${x}</label>`).join('');pal.innerHTML=qs.map((_,k)=>`<button class="p ${a[k]?'ans':''} ${r[k]?'rev':''} ${k===i?'cur':''}" onclick="i=${k};render()">${k+1}</button>`).join('')}function prev(){if(i>0){i--;render()}}function next(){if(i<49){i++;render()}else submit()}function clearA(){a[i]='';render()}function mark(){r[i]=!r[i];render()}function submit(auto){if(!auto&&!confirm('Submit the test now?'))return;clearInterval(int);let c=0,w=0,u=0;qs.forEach((q,k)=>{if(!a[k])u++;else if(a[k]===q[3])c++;else w++});let s=c-w*.25;document.getElementById('test').classList.add('hidden');document.getElementById('result').classList.remove('hidden');timer.textContent='DONE';who.textContent='Candidate: '+name.value;score.textContent=s.toFixed(2);document.getElementById('c').textContent=c;document.getElementById('w').textContent=w;document.getElementById('u').textContent=u;pct.textContent=Math.max(0,s/50*100).toFixed(2)+'%';review.innerHTML=qs.map((q,k)=>`<div style="padding:10px;border-bottom:1px solid #ddd"><b>Q${k+1}.</b> ${q[1]}<br>Your answer: <b>${a[k]||'Not attempted'}</b> | Correct: <b>${q[3]}</b></div>`).join('')};</script></body></html>
